default:
  interruptible: true

stages:
  - test
  - cross_compile

agent-core-rust-test:
  stage: test
  image: rust:latest
  script:
    - rustup component add clippy rustfmt
    - cargo fmt --check
    - cargo clippy --all-targets --all-features -- -D warnings
    - cargo test --all-features
  cache:
    key: rust-cargo-$CI_COMMIT_REF_SLUG
    paths:
      - target/
      - $CARGO_HOME/registry/

agent-core-cross-compile:
  stage: cross_compile
  image: rust:latest
  variables:
    ANDROID_NDK_VERSION: "26.1.10909125"
    TARGET: aarch64-linux-android
  before_script:
    - apt-get update -qq && apt-get install -y -qq unzip wget
    - wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
    - mkdir -p /opt/android/cmdline-tools && unzip -q /tmp/cmdtools.zip -d /opt/android/cmdline-tools
    - mv /opt/android/cmdline-tools/cmdline-tools /opt/android/cmdline-tools/latest
    - export ANDROID_HOME=/opt/android
    - yes | /opt/android/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
    - /opt/android/cmdline-tools/latest/bin/sdkmanager "ndk;${ANDROID_NDK_VERSION}" > /dev/null
    - rustup target add ${TARGET}
    - |
      NDK_HOME="/opt/android/ndk/${ANDROID_NDK_VERSION}"
      TOOLCHAIN="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64"
      mkdir -p .cargo
      cat > .cargo/config.toml <<EOF
      [target.aarch64-linux-android]
      linker = "${TOOLCHAIN}/bin/aarch64-linux-android21-clang"
      ar = "${TOOLCHAIN}/bin/llvm-ar"
      EOF
  script:
    - cargo build --target ${TARGET} --release
  cache:
    key: rust-cross-$CI_COMMIT_REF_SLUG
    paths:
      - target/
      - $CARGO_HOME/registry/

[package]
name = "agent_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
strsim = "0.11"
log = "0.4"
tiktoken-rs = "0.6"
once_cell = "1.19"
regex = "1"
uniffi = { version = "0.29.0", default-features = true, features = ["cli"] }

[dev-dependencies]
insta = { version = "1.39", features = ["json"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/uniffi-bindgen.rs"

[[test]]
name = "fixtures"
path = "tests/fixtures.rs"

[[test]]
name = "kv_fixed_test"
path = "tests/kv_fixed_test.rs"

[[example]]
name = "mock_desktop_loop"
path = "examples/mock_desktop_loop.rs"

[package]
name = "agent_core"
version = "0.2.0"
edition = "2021"
rust-version = "1.78"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
strsim = "0.11"
log = "0.4"
tiktoken-rs = "0.6"
once_cell = "1.19"
regex = "1"
uniffi = { version = "0.29.0", default-features = true, features = ["cli"] }

[dev-dependencies]
insta = { version = "1.39", features = ["json"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/uniffi-bindgen.rs"

[[test]]
name = "fixtures"
path = "tests/fixtures.rs"

[[test]]
name = "kv_fixed_test"
path = "tests/kv_fixed_test.rs"

[[test]]
name = "policy_tiers_test"
path = "tests/policy_tiers_test.rs"

[[test]]
name = "context_store_test"
path = "tests/context_store_test.rs"

[[test]]
name = "state_ledger_test"
path = "tests/state_ledger_test.rs"

[[test]]
name = "tool_context_test"
path = "tests/tool_context_test.rs"

[[test]]
name = "file_context_test"
path = "tests/file_context_test.rs"

[[test]]
name = "manual_compact_test"
path = "tests/manual_compact_test.rs"

[[test]]
name = "compaction_triggers_test"
path = "tests/compaction_triggers_test.rs"

[[test]]
name = "context_management_end_to_end_test"
path = "tests/context_management_end_to_end_test.rs"

[[test]]
name = "tool_parse_integration"
path = "tests/tool_parse_integration.rs"

[[example]]
name = "mock_desktop_loop"
path = "examples/mock_desktop_loop.rs"
